name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Style, PHPStan, tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # composer.lock isn't committed (library) - resolve the newest allowed versions
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Code style
        run: composer check-style

      - name: PHPStan
        run: composer phpstan

      - name: Tests
        run: composer test
